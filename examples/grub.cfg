# Interactive demo. Replace the two sample menu bodies with your own boot entries to install.
insmod efi_gop
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg
if [ "$bettergrub_video" != ready ]; then
    loadfont "$prefix/fonts/menu-23.pf2"
    loadfont "$prefix/fonts/small-15.pf2"
    for mode in 1920x1080 1280x720 1024x768 800x600 auto; do
        set gfxmode="$mode"
        if terminal_output gfxterm; then
            set bettergrub_mode="$mode"
            break
        fi
    done
    set bettergrub_video=ready
    export bettergrub_video
    export bettergrub_mode
fi
set bettergrub_theme=frieren
if [ -s "$prefix/demo.env" ]; then
    load_env --file "$prefix/demo.env" bettergrub_theme
fi
if [ "$bettergrub_open_theme" ]; then
    set bettergrub_theme="$bettergrub_open_theme"
fi
export bettergrub_theme
set theme="$prefix/themes/frieren/theme.txt"
for name in binary-stars drakengard3 nier-automata minecraft; do
    if [ "$bettergrub_theme" = "$name" ]; then
        set theme="$prefix/themes/$name/theme.txt"
    fi
done
if [ "$bettergrub_theme" = frieren ]; then
    if [ -f "$prefix/themes/frieren/$bettergrub_mode/theme.txt" ]; then
        set theme="$prefix/themes/frieren/$bettergrub_mode/theme.txt"
    fi
fi
if [ "$bettergrub_theme" = minecraft ]; then
    loadfont "$prefix/themes/minecraft/Monocraft22.pf2"
    loadfont "$prefix/themes/minecraft/Monocraft30.pf2"
fi
export theme
set default=0
set timeout=-1

function demo_select_theme {
    set bettergrub_open_theme="$1"
    export bettergrub_open_theme
    set bettergrub_theme="$1"
    if [ -s "$prefix/demo.env" ]; then
        if save_env --file "$prefix/demo.env" bettergrub_theme; then true; fi
    fi
    configfile "$prefix/grub.cfg"
}

menuentry 'Windows' --class windows --class frost {
    echo 'Windows selected. This entry previews selection only.'
    sleep --interruptible 2
}
menuentry 'Arch Linux' --class arch --class ember {
    echo 'Arch Linux selected. This entry previews selection only.'
    sleep --interruptible 2
}
submenu 'Themes' --class themes --hotkey t {
    set theme="$prefix/themes/frieren/picker.txt"
    export theme
    menuentry 'Frieren' {
        demo_select_theme frieren
    }
    menuentry 'Binary Stars' {
        demo_select_theme binary-stars
    }
    menuentry 'Drakengard 3' --class drakengard3 {
        demo_select_theme drakengard3
    }
    menuentry 'NieR: Automata' --class nier-automata {
        demo_select_theme nier-automata
    }
    menuentry 'Minecraft' --class minecraft {
        demo_select_theme minecraft
    }
    if [ "$bettergrub_theme" = minecraft ]; then
        submenu 'Minecraft Title Screen' --class minecraft {
            set theme="$prefix/themes/minecraft/title/theme.txt"
            export theme
            menuentry 'Play' {
                demo_select_theme minecraft
            }
        }
    fi
}
